name: Синхронізація товарів з Google Таблиці

on:
  schedule:
    # кожні 20 хвилин; GitHub може зрідка запускати з невеликою затримкою під навантаженням
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Sync products.json from Google Sheet
        env:
          PRODUCTS_SHEET_URL: ${{ secrets.PRODUCTS_SHEET_URL }}
        run: node scripts/sync-products.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "melon-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/products.json
          if git diff --cached --quiet; then
            echo "Змін немає — нічого коммітити."
          else
            git commit -m "chore: sync products from Google Sheet"
            git push
          fi
